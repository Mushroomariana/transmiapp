<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TransMi App – Prototipo</title>
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff0400;--pri-bg:#3b3b3b;--pri-fg:#3b3b3b;--park:#cfe8c8;color-scheme:light;--band:#e6e6e6;--blue:#1456c8;--bg:#f2f2f2;--card:#fff;--ink:#222;--mute:#6b6b6b;--line:#dcdcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--band:#2a2a2a;--card:#1f1f1f;--ink:#f0f0f0;--mute:#a3a3a3;--line:#383838;--pri-bg:#4a4a4a;--pri-fg:#d9d9d9;--park:#2d4a2a;color-scheme:dark}
body{background:var(--bg)}#msvg g path{filter:brightness(1.45)}.shell{background:var(--bg)}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:390px;min-height:100vh;position:relative;padding:0 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin:0 -16px;padding:10px 16px;background:var(--card);position:relative}
.logo img{height:44px;display:block;border-radius:8px;background:#fff;padding:3px}
.gear{width:42px;height:42px;border-radius:50%;border:0;background:#E53935;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85);display:grid;place-items:center;cursor:pointer}
.gear svg{width:22px;height:22px;transition:transform .35s}
.gear[aria-expanded="true"] svg{transform:rotate(90deg)}
.menu{position:absolute;right:16px;top:64px;width:230px;background:var(--card);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);overflow:hidden;z-index:20;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:15px 18px;border:0;background:none;color:var(--ink);font:600 15px Figtree,sans-serif;cursor:pointer;border-bottom:1px solid var(--line)}
.menu button:last-child{border:0}
.menu button:hover,.menu button:focus-visible{background:rgba(120,120,120,.14);outline:none}
.banner{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:1100/400;background:var(--band)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;bottom:10px;display:flex;gap:6px}
.dots span{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.6;box-shadow:0 0 3px rgba(0,0,0,.4)}.dots span:first-child{opacity:1}
.panel{background:var(--card);border-radius:20px;padding:14px;margin:14px 0;box-shadow:0 1px 0 var(--line)}
.search{margin:0 0 14px;display:flex;align-items:center;background:var(--band);border:2px solid var(--line);border-radius:14px;padding:0 14px}
.search input{flex:1;border:0;background:none;padding:14px 0;font:400 15px Figtree,sans-serif;color:var(--ink);outline:none}
.search svg{width:22px;height:22px;stroke:var(--accent)}
.near{padding:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.near p{margin:0;font-size:12px;color:var(--mute)}.near h3{margin:2px 0 8px;font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--accent);color:#fff}
.tag.sitp{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.tag.tm{display:inline-flex;align-items:center;gap:5px;padding-left:4px}
.ticon{height:15px;width:15px;object-fit:cover;border-radius:3px;background:#111}
.tag.code{background:var(--band);color:var(--ink)}
.btn{border:2px solid var(--accent);background:none;color:var(--accent);font:800 14px Figtree,sans-serif;border-radius:12px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn:active{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;background:var(--band);border-radius:22px;padding:16px}
.grid+.grid{margin-top:14px}
.tile{background:var(--card);border:0;border-radius:18px;min-height:118px;padding:8px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;font:800 16px Figtree,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tile svg{width:34px;height:34px;stroke:var(--pri-fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile:active{background:var(--pri-bg);color:#fff}.tile:active svg{stroke:#fff}
.sos{position:fixed;left:max(16px,calc(50% - 179px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#E53935;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 12px Figtree,sans-serif;letter-spacing:.3px;box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer}
.sos svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal.open{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:380px;max-height:85vh;overflow:auto;border-radius:22px;padding:22px 20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet{position:relative}.sheet h2{margin:0 0 14px;padding-right:32px;font-size:20px;color:var(--pri-fg)}
.sheet p{line-height:1.5;color:var(--ink)}
.sheet .close{position:absolute;top:12px;right:14px;border:0;background:none;font-size:26px;color:var(--mute);cursor:pointer}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:600;cursor:pointer}details p{margin:8px 0 0;color:var(--mute)}
.lang{display:flex;gap:10px}.lang button{flex:1;padding:14px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);font:600 15px Figtree,sans-serif;cursor:pointer}
.lang button.on{border-color:var(--pri-fg);background:rgba(120,120,120,.14);color:var(--pri-fg)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.toast.show{opacity:1}

.shell{width:100%;max-width:390px;margin:0 auto;min-height:100vh;position:relative}
@media (min-width:520px){body{background:#cfcfcf;align-items:center;min-height:100vh}
.shell{height:min(844px,96vh);min-height:0;margin:2vh auto;overflow:auto;background:var(--bg);border-radius:34px;box-shadow:0 0 0 8px #222,0 20px 60px rgba(0,0,0,.35);transform:translateZ(0);scrollbar-width:none}
@media (prefers-color-scheme:dark){body{background:#0a0a0a}}
.shell::-webkit-scrollbar{display:none}.app{min-height:0}.mapview{border-radius:34px;overflow:hidden}}
.mscroll,.legend{scrollbar-width:none}.mscroll::-webkit-scrollbar,.legend::-webkit-scrollbar{display:none}
.mscroll{touch-action:pan-x pan-y;cursor:grab;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.mscroll:active{cursor:grabbing}
.mapview{position:fixed;inset:0;max-width:390px;margin:0 auto;background:var(--card);z-index:25;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mapview.open{display:flex}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--accent);color:#fff}
.mhead h2{margin:0;font-size:19px}
.back{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.legend{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:5px 6px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;color:var(--ink)}
.chip b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:#fff;font-size:12px}
.mscroll{flex:1;overflow:auto;background:var(--card)}
#msvg{display:block}
.lbl{font:600 10px Figtree,sans-serif;fill:var(--ink)}.lbl.b{font-weight:800;font-size:11.5px}
.hit{fill:transparent;cursor:pointer;outline:none}.hit:focus-visible{stroke:var(--pri-fg);stroke-width:2}
.hint{font:italic 10px Figtree,sans-serif;fill:var(--mute)}
.mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.go{grid-column:1/-1;display:none;border:0;border-radius:14px;background:var(--accent);color:#fff;font:800 16px Figtree,sans-serif;padding:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22),0 8px 14px rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
.go.show{display:block}.go:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.mbar div{background:var(--card);border-radius:12px;padding:8px 12px;min-width:0}
.mbar small{display:block;color:var(--mute);font-size:11px}.mbar b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.act{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:12px;border:2px solid var(--pri-fg);background:none;color:var(--pri-fg);font:800 14px Figtree,sans-serif;cursor:pointer}
.act:active{background:var(--pri-bg);color:#fff}
a.act{text-decoration:none}.act.purple{background:#7b2cbf;border-color:#7b2cbf;color:#fff}.act.main{background:var(--pri-bg);color:#fff}
#rep{display:none;margin-top:4px}#rep.open{display:block}
#rep textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font:400 15px Figtree,sans-serif;resize:vertical}
#rep .act{margin:10px 0 0;text-align:center;background:var(--pri-bg);color:#fff}
#st-body .act{box-shadow:0 3px 0 rgba(0,0,0,.22),0 8px 14px rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
#st-body .act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.amens{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.amen{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:10px;background:var(--band);font-size:11.5px;font-weight:600}
.amen svg{width:16px;height:16px;stroke:var(--pri-fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.amen.off{opacity:.45}.amen.off span{text-decoration:line-through}
.ql{margin:8px 0 0;padding-left:20px;color:var(--ink);line-height:1.7;font-size:14px}.ql li::marker{color:var(--pri-fg)}
#m-sos .act,#st-body .act{width:78%;margin:0 auto 10px;text-align:center}
#m-sos .act.main{background:#E53935;border-color:#E53935;color:#fff}
#st-body .act{background:#E53935;border-color:#E53935;color:#fff}
#st-body .act.alt{background:none;color:var(--pri-fg);border-color:var(--pri-fg)}
#st-body .chips{margin:0 0 10px;padding-right:30px}
.mbar div{position:relative;padding-right:30px}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;border-radius:50%;background:rgba(120,120,120,.18);color:var(--mute);font:700 15px/1 Figtree,sans-serif;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ms.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;dr={x:e.clientX,y:e.clientY,l:ms.scrollLeft,t:ms.scrollTop};mvd=false});
window.addEventListener("pointermove",e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>5)mvd=true;ms.scrollLeft=dr.l-dx;ms.scrollTop=dr.t-dy});
window.addEventListener("pointerup",()=>{dr=null});
ms.addEventListener("click",e=>{if(mvd){e.stopPropagation();e.preventDefault();mvd=false}},true);
